[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hhd-z13"
version = "0.1.0"
description = "CPU EPP/boost/perf-mode and display refresh-rate control for the ASUS ROG Flow Z13, via z13ctl-plus and kscreen-doctor"
requires-python = ">=3.10"

[project.entry-points."hhd.plugins"]
z13_cpu = "hhd_z13:autodetect"

[tool.setuptools]
packages = ["hhd_z13"]

[tool.setuptools.package-data]
hhd_z13 = ["settings.yml", "display_settings.yml"]
