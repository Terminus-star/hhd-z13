[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hhd-z13"
version = "0.3.0"
description = "CPU EPP/boost/perf-mode and display refresh-rate control for the ASUS ROG Flow Z13, via z13ctl-plus and kscreen-doctor"
requires-python = ">=3.10"

[project.entry-points."hhd.plugins"]
# Named for the DEVICE, not one of the plugins it provides, matching every
# per-hardware module upstream: rog_ally, legion_go, msi_claw, gpd_win,
# ayaneo, orange_pi, onexplayer. The old name "z13_cpu" was one of the two
# plugins inside, so hhd logged the contradictory
#     -  z13_cpu: z13_cpu, z13_display
# where upstream reads
#     - rog_ally: rog_ally
rog_flow_z13 = "hhd_z13:autodetect"

[tool.setuptools]
packages = ["hhd_z13"]

[tool.setuptools.package-data]
hhd_z13 = ["settings.yml", "display_settings.yml", "firmware_settings.yml"]
