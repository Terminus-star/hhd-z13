z13_panel_overdrive:
  panel_overdrive:
    type: bool
    title: Panel Overdrive
    tags: [ non-essential ]
    default: False
    hint: >-
      Speeds up LCD pixel transitions to cut motion blur, at the cost of
      some overshoot ("inverse ghosting") on high-contrast edges. A firmware
      setting on the panel itself, applied immediately.

      Deliberately independent of Refresh Rate. G-Helper ties the two
      together on Windows; here it stays a setting you choose, not a side
      effect of changing Hz, so a rate change never alters image quality
      behind your back.

z13_firmware:
  type: container
  title: Firmware
  tags: [ non-essential ]
  hint: >-
    ASUS firmware attributes, written straight to
    /sys/class/firmware-attributes/asus-armoury.
  children:
    boot_sound:
      type: bool
      title: Boot POST Sound
      tags: [ non-essential ]
      default: True
      hint: >-
        The chime the firmware plays at power-on. Stored in firmware, so it
        survives reinstalls and takes effect at the next cold boot rather
        than immediately.
