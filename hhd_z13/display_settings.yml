z13_display:
  title: Z13 Display
  type: container
  # hide-title: nested inside hhd's own "Display" container, so its own
  # header would duplicate that grouping. Title kept for i18n and logs, the
  # same way every upstream driver that nests does it.
  tags: [ hide-title, non-essential ]
  hint: >-
    Internal panel refresh rate (60/180 Hz), via kscreen-doctor -- run
    inside your KDE Wayland session, not by hhd directly, since hhd itself
    runs as root and has no session of its own from which to reach the
    compositor. Requires the KDE desktop to be the FOREGROUND session: if
    gamescope currently owns the screen (this session backgrounded), no
    KScreen is reachable to change, so the control below is replaced with a
    status message instead of silently doing nothing when flipped.
  children:
    status:
      type: mode
      tags: [no_dropdown]
      default: unavailable
      modes:
        available:
          type: container
          children:
            refresh_rate:
              type: mode
              title: Refresh Rate
              tags: [dropdown]
              default: auto
              hint: >-
                Switches the internal panel (eDP-1) only -- an external
                display, if connected, is left alone. Applied immediately;
                on the very first read after hhd starts, this instead
                silently adopts whatever the panel is already running at,
                so starting hhd never itself changes your screen.
                Auto follows the power source, restoring the behaviour
                z13ctl-plus's AC/battery presets used to provide before that
                preset switching had to be disabled for fighting hhd over
                TDP: 180 Hz plugged in, 60 Hz on battery, where the panel is
                one of the larger draws. Picking 60 or 180 explicitly pins
                it -- a charger being plugged in or out will not override a
                rate you chose yourself. Auto also stands aside entirely
                while gamescope owns the screen, rather than flipping the
                panel under a running game.
                If a nested gamescope session is running, its framerate
                cap follows this setting -- 60 Hz caps the game at 60, and
                going back to 180 lifts the cap. gamescope's own refresh
                cannot be changed after it starts, so capping the game is
                what stops it rendering above what the panel is showing.
              modes:
                auto:
                  type: container
                  title: Auto 
                  children:
                    # Lives inside the "auto" mode container, so hhd renders it
                    # only while Auto is selected -- a mode shows the children
                    # of the chosen mode and nothing else. That is also what
                    # gates the polling: update() reads the panel for this only
                    # when rate_mode is auto, so choosing Manual stops the
                    # kscreen-doctor calls rather than merely hiding the text.
                    current:
                      type: display
                      title: Current
                      hint: >-
                        What the panel is actually running at, read back from
                        the compositor rather than inferred from the power
                        source. Auto writes the rate on an AC/battery change
                        and then leaves the panel alone, so this is the only
                        confirmation that the switch really landed.
                manual:
                  type: container
                  title: Manual
                  children:
                    rate:
                      type: multiple
                      title: Rate
                      tags: [ordinal]
                      default: "180"
                      options:
                        # Quoted deliberately: YAML 1.1 turns a bare 60/180 into an int,
                        # which breaks the string comparisons in display.py.
                        "60": 60Hz
                        "180": 180Hz
                        # A tier ABOVE 180, not a separate axis: 180 Hz with panel
                        # overdrive on. Modelled this way because overdrive's value
                        # scales with refresh -- at 60 Hz a frame lasts 16.7 ms and
                        # most pixel transitions finish unaided, while at 180 Hz they
                        # have 5.6 ms and cannot. Making it a rung on the same ladder
                        # also makes the bad combination unreachable: overdrive's
                        # overshoot is tuned for the short frame, so holding it for a
                        # 60 Hz frame is where inverse ghosting becomes visible.
                        "overdrive": 180Hz + Overdrive
                      hint: >-
                        A fixed rate, ignoring the power source. Only shown while the mode
                        above is Manual. "180 Hz + Overdrive" runs 180 Hz and turns on
                        panel overdrive, which speeds up pixel transitions to cut motion
                        blur; the trade is possible overshoot ("inverse ghosting") on
                        high-contrast edges. Selecting 60 or 180 turns it back off.
            vrr:
              type: multiple
              title: Adaptive Sync
              tags: [ordinal]
              default: automatic
              options:
                never: Never
                automatic: Automatic
                always: Always
              hint: >-
                KDE's variable refresh policy for the internal panel. Automatic
                engages it only for windows KWin judges eligible; Always keeps it
                on. Applied with kscreen-doctor, the same way the refresh rate
                above is, so it takes effect immediately rather than at next
                login. Adopted silently on the first read, so starting hhd never
                changes it by itself.
        unavailable:
          type: container
          children:
            reason:
              type: display
              tags: [error]
              title: Unavailable
              default: >-
                No usable KDE Wayland session detected yet.
