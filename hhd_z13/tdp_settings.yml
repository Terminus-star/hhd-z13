# User-created TDP presets, applied through adjustor's OWN Custom mode.
#
# HOW A PRESET IS APPLIED
#   Selecting one writes tdp.asus.tdp_v2.custom.tdp / .custom.boost and sets
#   tdp.asus.tdp_v2.mode to "custom" -- the identical path a user takes by
#   hand. adjustor then does every hardware write.
#
#   Reusing the stock path rather than adding preset MODES is deliberate and
#   is what makes this survive KDE. Unplugging makes KDE change its power
#   profile; adjustor maps that onto a stock mode and force-writes it over the
#   config. Against a preset mode that silently replaced the user's choice
#   (observed: unplugging landed on Silent). Against Custom it only flips the
#   visible LABEL, because the quiet branch writes a fan curve and never
#   touches PPT -- so the wattage survives. That is behaviour stock Custom has
#   always had, and inheriting it is worth more than owning a dropdown entry.
#
# THE PRESET LIST IS DYNAMIC
#   hhd fixes a mode's entries when settings() runs, so add/remove works by
#   storing a count and asking hhd to rebuild the tree. `active.modes` and the
#   two power-change dropdowns below are therefore filled in by tdp.py, not
#   written here -- this file provides the TEMPLATE for one preset and the
#   shell around it.

# ── one preset ────────────────────────────────────────────────────────────
# Deep-copied per slot by tdp.py. Never referenced by a YAML alias: aliases
# would make every slot the same dict object, and the settings tree is walked
# and annotated in several places.
preset_template:
  type: container
  title: Preset
  children:

    tdp:
      type: int
      title: TDP  (PL1, sustained)
      # 5 and 65 are adjustor's own Z1_DATA min_tdp/max_tdp for this machine,
      # and 65 is what it clamps to while "Enforce Device TDP Limits" is on --
      # its default. Matching that range exactly means its clamp never fires,
      # so it never writes custom.tdp back underneath us.
      #
      # The floor really is 5 W. asus-armoury advertises 28, but that is the
      # interface's own advertised minimum, not a hardware limit: 9, 15 and
      # 20 W are all measured working on this machine.
      min: 5
      max: 65
      step: 1
      default: 45
      unit: W
      hint: >-
        Sustained power target. Check it with
        `cat /sys/devices/platform/asus-nb-wmi/ppt_pl1_spl` -- not through
        asus-armoury, which reports the firmware profile's own numbers rather
        than the live override.

    boost:
      type: bool
      title: TDP Boost
      default: True
      hint: >-
        Lets the short and fast limits rise above the sustained one. Only has
        an effect BELOW 35 W: adjustor derives them with a constant chosen for
        the ROG Ally, so at 35 W and above all three collapse to the same
        number. Ignored entirely when Power Limits below is set to Manual.

    ppt:
      type: mode
      title: Power Limits
      tags: [dropdown]
      default: auto
      hint: >-
        Auto derives the short (PL2) and fast (PL3) limits from the sustained
        one, which is what adjustor does on its own. Manual states all three
        outright -- the only way to get a meaningful PL2/PL3 split at or above
        35 W, where the boost toggle stops doing anything.
      modes:
        auto:
          type: container
          title: Auto (derived from TDP)
        manual:
          type: container
          title: Manual
          children:
            sppt:
              type: int
              title: PL2  (short boost)
              # Ceilings from asus-armoury's max_value, which corroborate
              # z13ctl-plus's documented caps. Its MINIMA are ignored for the
              # same reason as PL1's. tdp.py enforces PL1 <= PL2 <= PL3 before
              # writing, because the firmware REJECTS a lower tier that
              # exceeds a higher one rather than clamping it.
              min: 5
              max: 92
              step: 1
              default: 45
              unit: W
              hint: >-
                Short-duration limit. Raised to the sustained value
                automatically if you set it lower.
            fppt:
              type: int
              title: PL3  (fast boost)
              min: 5
              max: 93
              step: 1
              default: 45
              unit: W
              hint: >-
                Fastest-duration limit. Raised to PL2 automatically if you set
                it lower.


# ── the container tdp.py mounts ───────────────────────────────────────────
z13_presets:
  type: container
  title: Custom Presets
  hint: >-
    Named power profiles applied through adjustor's Custom mode. The TDP Mode
    selector above will read "Custom" while one is active.
  children:

    active:
      type: mode
      title: Preset
      tags: [dropdown]
      # `modes` is filled in by tdp.py from the stored count. Left empty here
      # rather than omitted so the shape is obvious when reading this file.
      modes: {}

    add:
      type: action
      title: Add Preset
      hint: >-
        Appends a slot, copying the values of the one selected above so a new
        preset starts from something useful. Rebuilds the settings tree, so
        the panel reloads briefly.

    remove:
      type: action
      title: Remove Preset
      hint: >-
        Deletes the selected preset. The last one cannot be removed. Rebuilds
        the settings tree, so the panel reloads briefly.

    count:
      type: int
      title: Preset Slots
      # How many slots exist. Persisted here so the list survives a restart --
      # settings() cannot ask the config, so tdp.py reads this in update() and
      # rebuilds if it disagrees with what it last generated.
      #
      # Visible rather than hidden on purpose: it is the honest way to see and
      # repair the count if an add/remove ever leaves it inconsistent.
      tags: [non-essential]
      min: 1
      max: 8
      step: 1
      default: 2
      hint: >-
        Number of preset slots. Normally changed with the buttons above.

    # Written by tdp.py, read by adjustor via the z13-tdp-presets patch. Both
    # zero means "derive them", which is upstream's behaviour and what the
    # stock Custom mode always gets.
    sppt:
      type: int
      title: Applied PL2
      tags: [non-essential]
      min: 0
      max: 92
      step: 1
      default: 0
      unit: W
      hint: >-
        Read-only in practice — set from the active preset. 0 means the limit
        is derived rather than stated.
    fppt:
      type: int
      title: Applied PL3
      tags: [non-essential]
      min: 0
      max: 93
      step: 1
      default: 0
      unit: W
      hint: >-
        Read-only in practice — set from the active preset. 0 means the limit
        is derived rather than stated.


# ── power-change policy ───────────────────────────────────────────────────
z13_tdp_auto:
  type: mode
  title: Preset on Power Change
  # Default disabled: enabling it means unplugging can move you off something
  # you chose by hand.
  default: disabled
  hint: >-
    Apply a preset automatically when the charger is plugged in or unplugged.
    Edge-triggered -- it acts on the transition, never continuously, so a
    change you make by hand afterwards stays. On startup it adopts the current
    power source without applying anything.
  modes:
    disabled:
      type: container
      title: Disabled
    enabled:
      type: container
      title: Enabled
      children:
        # `options` for both are filled in by tdp.py: the presets that
        # currently exist, plus adjustor's three stock profiles.
        ac_preset:
          type: multiple
          title: On AC
          tags: [dropdown]
          options: {}
        dc_preset:
          type: multiple
          title: On Battery
          tags: [dropdown]
          options: {}


# Filled by tdp.py. An empty string renders as nothing, so this is invisible
# unless there is something wrong to report.
z13_tdp_status:
  type: display
  title: " "
  tags: []
