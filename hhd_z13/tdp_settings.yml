# TDP presets: saved configurations that sit in adjustor's own TDP Mode
# dropdown, beside Silent / Performance / Turbo / Custom.
#
# THE SHAPE
#   Custom is the scratchpad. You set TDP, TDP Boost and the two boost limits
#   there, and "Add Preset" freezes the current values into a new entry in the
#   dropdown above. Those entries are complete configurations: selecting one
#   applies it, and it carries no sliders, because a saved preset that could
#   be edited in place is just Custom with extra steps.
#
# WHY PRESET MODES ARE VIABLE AGAIN
#   An earlier attempt at this lost to KDE: adjustor's ppd handler mapped an
#   incoming power profile onto a stock mode and force-wrote it, so a preset
#   mode was replaced a second or two after being selected. That turned out to
#   be adjustor answering an ECHO of its own report -- the z13-tdp-presets
#   patch's ppd-echo entry ignores those now, so a selected mode stays put.
#
# WHY PL2/PL3 SIT DIRECTLY UNDER TDP BOOST
#   They are what TDP Boost buys: with boost off all three limits are the same
#   number, so they are omitted from the tree entirely then. With it on they
#   follow PL1 automatically -- moving the TDP slider recomputes both from
#   this panel's own firmware proportions -- and can then be nudged. Keeping
#   them adjacent to the slider they track is what stops them drifting into
#   limits that have nothing to do with the sustained value.
#
# THE PRESET LIST IS DYNAMIC
#   hhd fixes a mode's entries when settings() runs, so add/remove works by
#   editing the store and asking hhd to rebuild the tree. The modes below are
#   filled in by tdp.py; this file provides the pieces.

# ── merged into adjustor's custom mode ────────────────────────────────────
# z13_-prefixed so nothing collides with adjustor's own `tdp` and `boost`.
z13_custom_children:

  z13_sppt:
    type: int
    title: PL2  (short boost)
    # Ceilings are asus-armoury's own max_value figures. Its MINIMA are
    # ignored, for the same reason PL1's advertised 28 W is: they are the
    # interface's limits, not the hardware's. tdp.py enforces
    # PL1 <= PL2 <= PL3 before writing, because the firmware REJECTS a lower
    # tier that exceeds a higher one rather than clamping it.
    min: 5
    max: 92
    step: 1
    default: 56
    unit: W
    hint: >-
      Short-duration limit. Follows the TDP slider automatically -- moving it
      recomputes this from the proportions this machine's firmware ships
      (60/75/86 W, so 1.25x) -- and can be adjusted afterwards. Raised back to
      the sustained value if you set it lower.

  z13_fppt:
    type: int
    title: PL3  (fast boost)
    min: 5
    max: 93
    step: 1
    default: 64
    unit: W
    hint: >-
      Fastest-duration limit, 1.433x the sustained value by default. Follows
      the TDP slider the same way, and is raised back to PL2 if you set it
      lower.

  z13_add:
    type: action
    title: Add Preset
    hint: >-
      Saves the current TDP, boost and limits as a new entry in the TDP Mode
      dropdown above. Rebuilds the settings tree, so the panel reloads
      briefly.

  z13_status:
    # Empty renders as nothing, so this is invisible unless something is
    # wrong to report.
    type: display
    title: " "
    tags: []


# ── always visible, whatever TDP Mode is selected ─────────────────────────
# A sibling of the TDP Mode selector rather than a child of Custom, so it
# still reports while a saved preset or a stock profile is active -- which is
# exactly when you most want to know what the hardware is actually doing,
# because those modes offer no sliders to read the answer off.
z13_applied:
  # Live telemetry, read back from asus-nb-wmi -- the interface adjustor
  # writes. Read-only on the same contract as the refresh-rate indicator:
  # read the hardware, show it, never write it.
  type: display
  title: Applied Power Limits
  hint: >-
    What the three limits actually are right now, read from
    /sys/devices/platform/asus-nb-wmi/. Not asus-armoury, which reports the
    firmware profile's own numbers rather than the live override.


# ── one saved preset, copied per slot by tdp.py ───────────────────────────
# Deliberately holds no sliders. It is a finished configuration; the place to
# change values is Custom, and "Add Preset" there to save a new one.
preset_template:
  type: container
  children:
    remove:
      type: action
      title: Remove This Preset
      hint: >-
        Deletes this preset and returns to Custom. Rebuilds the settings tree,
        so the panel reloads briefly.


# ── its own area, beside the TDP Mode selector ────────────────────────────
z13_power:
  type: mode
  title: Preset on Power Change
  # Default disabled: enabling it means unplugging can move you off something
  # you chose by hand.
  default: disabled
  hint: >-
    Switch TDP Mode automatically when the charger is plugged in or unplugged.
    Edge-triggered -- it acts on the transition, never continuously, so a
    change you make by hand afterwards stays. On startup it adopts the current
    power source without applying anything.
  modes:
    disabled:
      type: container
      title: Disabled
    enabled:
      type: container
      title: Enabled
      children:
        # `options` are filled in by tdp.py: the saved presets that currently
        # exist, plus adjustor's three stock profiles.
        ac_preset:
          type: multiple
          title: On AC
          tags: [dropdown]
          options: {}
        dc_preset:
          type: multiple
          title: On Battery
          tags: [dropdown]
          options: {}
